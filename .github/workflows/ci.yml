name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  schedule:
    - cron: '30 20 * * *' # 2 AM IST: the nightly full eval run (spec §20)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  database:
    # The unit tests run migrations on in-process PGlite; this proves the same
    # migrations and seed on a real Postgres 16 + pgvector, and that the API
    # comes up ready against it.
    name: Migrate, seed, boot and run the WhatsApp loop against real services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: haazir
          POSTGRES_PASSWORD: haazir
          POSTGRES_DB: haazir
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U haazir" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      DATABASE_URL: postgres://haazir:haazir@localhost:5432/haazir
      REDIS_URL: redis://localhost:6379
      # Test-only values: the mock Graph API stands in for Meta.
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      META_APP_SECRET: ci-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-verify-token
      META_GRAPH_BASE_URL: http://localhost:4010
      WHATSAPP_PHONE_NUMBER_ID: '100000000000001'
      WHATSAPP_WABA_ID: '200000000000001'
      WHATSAPP_ACCESS_TOKEN: ci-mock-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Migrations are idempotent
        run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Seed is idempotent
        run: pnpm db:seed
      - run: pnpm build
      - name: WhatsApp loop end to end (mock Meta)
        run: ./scripts/e2e-whatsapp.sh
      - name: Coaching journey end to end (enquiry to receipt; mock Meta and Razorpay)
        run: ./scripts/e2e-coaching.sh

  evals:
    # The 73 coaching conversations against real models (spec §11.7). Runs
    # when an LLM key is configured as a repository secret, and skips with a
    # notice until then. Fails under 85% or on any invented number.
    name: Evals (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Required by the env schema; evals use in-process Postgres, not these.
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      DATABASE_URL: postgres://unused@localhost/unused
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      LLM_FAST_MODEL: ${{ vars.LLM_FAST_MODEL }}
      LLM_SMART_MODEL: ${{ vars.LLM_SMART_MODEL }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm evals
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/latest.json
          if-no-files-found: ignore
